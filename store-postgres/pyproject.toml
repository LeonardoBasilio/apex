[project]
name = "apex-store-postgres"
version = "0.1.0"
description = "Postgres DDL + Kafka consumer, replacing upstream infra/'s ClickHouse ownership."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
kafka = ["kafka-python>=2.0,<3"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
