[project]
name = "apex-stream-kafka"
version = "0.1.0"
description = "Kafka transport between capture-pyspark and store-postgres, replacing the upstream OTel Collector config."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kafka = ["kafka-python>=2.0,<3"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
