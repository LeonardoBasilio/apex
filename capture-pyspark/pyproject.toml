[project]
name = "apex-capture-pyspark"
version = "0.1.0"
description = "Native PySpark SparkListener capture, replacing the upstream Scala jar/ plugin."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.2"]
kafka = ["kafka-python>=2.0,<3"]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
